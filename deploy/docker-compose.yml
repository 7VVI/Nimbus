services:
  mysql:
    image: mysql:8.0
    container_name: nimbus-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - nimbus-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: nimbus-redis
    ports:
      - "6379:6379"
    volumes:
      - nimbus-redis-data:/data

volumes:
  nimbus-mysql-data:
  nimbus-redis-data:
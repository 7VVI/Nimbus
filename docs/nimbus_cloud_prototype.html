  --text1:#1C2024; --text2:#60646C; --text3:#8B909A;
  --border:#E6E8EB; --border2:#D9DCE1;
  --bg-app:#F7F8FA; --hover:#F4F5F6;

  --cyan:#0EA5A5; --cyan-lt:#E0F5F4;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'DM Sans','PingFang SC','Microsoft YaHei',sans-serif;
  background:#EEEFF1;color:var(--text1);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
button{font-family:inherit;font-size:inherit;border:none;background:none;color:inherit;cursor:pointer}
input{font-family:inherit;border:none;outline:none;background:none;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#CFD3D9;border-radius:6px;border:2.5px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#B8BDC5;border:2.5px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
.row-hover{transition:background .12s ease}
.row-hover:hover{background:var(--hover)}
.fade-in{animation:fadeUp .32s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pop-in{animation:popIn .22s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes popIn{from{opacity:0;transform:scale(.95) translateY(4px)}to{opacity:1;transform:none}}
.slide-up{animation:slideUp .25s ease both}
@keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.dots-bg{
  background-color:#EDEEF0;
  background-image:radial-gradient(#D8DBE0 1px, transparent 1px);
  background-size:22px 22px;
}
kbd{
  font-family:'DM Sans',monospace;font-size:11px;color:var(--text3);
  border:1px solid var(--border2);border-bottom-width:2px;border-radius:4px;
  padding:1px 5px;background:#fff;
}

function I({name,size=18,color='currentColor',sw=1.7,filled=false,style}){
  const isFill = filled && (name==='star'||name==='play');
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill={isFill?'currentColor':'none'}
      stroke={isFill?'none':color} strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round" style={style}>
      {PATHS[name]}
    </svg>
  );
}

const AV_COLORS=['#3E63DD','#8E4EC6','#129764','#DE911D','#C2255C','#0EA5A5'];
function Avatar({name,label,size=28,ring=false}){
  const idx=(name?name.charCodeAt(0):65)%AV_COLORS.length;
  return (
    <div style={{
      width:size,height:size,borderRadius:'50%',flexShrink:0,
      background:`linear-gradient(135deg,${AV_COLORS[idx]},${AV_COLORS[idx]}B3)`,
      color:'#fff',fontSize:size*0.42,fontWeight:600,
      display:'flex',alignItems:'center',justifyContent:'center',
      boxShadow:ring?'0 0 0 2px #fff':'none'
    }}>{label||name[0]}</div>
  );
}
function AvatarStack({names,labels,size=24}){
  return (
    <div style={{display:'flex'}}>
      {names.map((n,i)=>(
        <div key={i} style={{marginLeft:i?-8:0,zIndex:10-i}}>
          <Avatar name={n} label={labels&&labels[i]} size={size} ring={true}/>
        </div>
      ))}
    </div>
  );
}
function Badge({color='gray',children,solid=false,style}){
  const map={
    gray:['#F1F2F4','#60646C'],blue:['var(--accent-lt)','var(--accent)'],
    green:['var(--green-lt)','var(--green)'],orange:['var(--orange-lt)','#A96A0A'],
    red:['var(--red-lt)','var(--red)'],purple:['var(--purple-lt)','var(--purple)'],
    cyan:['var(--cyan-lt)','#0B7E7E'],
  };
  const pair=map[color]||map.gray;
  return (
    <span style={{
      display:'inline-flex',alignItems:'center',gap:4,padding:'2px 8px',
      borderRadius:999,fontSize:11.5,fontWeight:600,lineHeight:'18px',
      background:solid?pair[1]:pair[0],color:solid?'#fff':pair[1],whiteSpace:'nowrap',...style
    }}>{children}</span>
  );
}
function Checkbox({checked,onChange,dim}){
  return (
    <div onClick={e=>{e.stopPropagation();onChange&&onChange();}} style={{
      width:17,height:17,borderRadius:5,cursor:'pointer',flexShrink:0,
      border:checked?'none':'1.5px solid var(--border2)',
      background:checked?'var(--accent)':(dim?'transparent':'#fff'),
      display:'flex',alignItems:'center',justifyContent:'center',
      transition:'all .12s ease'
    }}>
      {checked && <I name="check" size={11} color="#fff" sw={2.6}/>}
    </div>
  );
}
function ProgressLine({pct,color='var(--accent)',h=6,track='#EBECEE'}){
  return (
    <div style={{width:'100%',height:h,borderRadius:h/2,background:track,overflow:'hidden'}}>
      <div style={{width:pct+'%',height:'100%',borderRadius:h/2,background:color,transition:'width .3s ease'}}/>
    </div>
  );
}
function Ring({pct,size=110,sw=10,color='var(--accent)',track='#E9EAEC',children}){
  const r=(size-sw)/2,C=2*Math.PI*r;
  return (
    <div style={{position:'relative',width:size,height:size,flexShrink:0}}>
      <svg width={size} height={size} style={{transform:'rotate(-90deg)'}}>
        <circle cx={size/2} cy={size/2} r={r} stroke={track} strokeWidth={sw} fill="none"/>
        <circle cx={size/2} cy={size/2} r={r} stroke={color} strokeWidth={sw} fill="none"
          strokeDasharray={C} strokeDashoffset={C*(1-pct/100)} strokeLinecap="round"/>
      </svg>
      <div style={{position:'absolute',inset:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center'}}>{children}</div>
    </div>
  );
}
function Switch({on,onClick}){
  return (
    <div onClick={onClick} style={{width:42,height:25,borderRadius:13,background:on?'var(--green)':'#CBCFD6',
      position:'relative',transition:'background .2s',flexShrink:0,cursor:'pointer'}}>
      <div style={{position:'absolute',top:2.5,left:on?19.5:2.5,width:20,height:20,borderRadius:'50%',
        background:'#fff',boxShadow:'0 1px 3px rgba(0,0,0,.25)',transition:'left .2s'}}/>
    </div>
  );
}
function GhostBtn({icon,children,danger,onClick,style}){
  return (
    <button onClick={onClick} style={{
      display:'inline-flex',alignItems:'center',gap:6,height:32,padding:'0 12px',
      borderRadius:8,fontSize:13,fontWeight:500,color:danger?'var(--red)':'var(--text1)',
      transition:'background .12s',whiteSpace:'nowrap',...style
    }}
    onMouseEnter={e=>e.currentTarget.style.background=danger?'var(--red-lt)':'var(--hover)'}
    onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
      {icon && <I name={icon} size={16}/>}
      {children}
    </button>
  );
}
function PrimaryBtn({icon,children,onClick,style}){
  return (
    <button onClick={onClick} style={{
      display:'inline-flex',alignItems:'center',gap:6,height:34,padding:'0 14px',
      borderRadius:8,fontSize:13,fontWeight:600,color:'#fff',background:'var(--accent)',
      boxShadow:'0 1px 2px rgba(62,99,221,.4)',transition:'background .12s',whiteSpace:'nowrap',...style
    }}
    onMouseEnter={e=>e.currentTarget.style.background='var(--accent-h)'}
    onMouseLeave={e=>e.currentTarget.style.background='var(--accent)'}>
      {icon && <I name={icon} size={16}/>}
      {children}
    </button>
  );
}

  folder:{c:'#3E63DD',bg:'#EAEFFE',ic:'folder'},
  doc:{c:'#2E90FA',bg:'#E8F3FF',ic:'doc'},
  sheet:{c:'#30A46C',bg:'#E5F6EC',ic:'sheet'},
  slide:{c:'#F76B15',bg:'#FEF0E5',ic:'slide'},
  pdf:{c:'#D13438',bg:'#FEECEC',ic:'doc'},
  img:{c:'#8E4EC6',bg:'#F5EDFB',ic:'img'},
  video:{c:'#C2255C',bg:'#FBEBF1',ic:'video'},
  audio:{c:'#0EA5A5',bg:'#E0F5F4',ic:'audio'},
  zip:{c:'#A1662F',bg:'#F7EFE2',ic:'zip'},
  code:{c:'#6E56CF',bg:'#EFEDFC',ic:'code'},

function TypeIcon({type,size=36,radius=9}){
  const m=TYPE_META[type]||TYPE_META.doc;
  return (
    <div style={{width:size,height:size,borderRadius:radius,background:m.bg,flexShrink:0,
      display:'flex',alignItems:'center',justifyContent:'center'}}>
      <I name={m.ic} size={size*0.52} color={m.c} sw={1.6}/>
    </div>
  );
}

const PALETTES=[
  ['#FFD3A5','#FD9781'],['#89B4FA','#7C5CD6'],['#99E2B4','#3FA67A'],
  ['#FBC7D4','#9796F0'],['#84FAB0','#59B4D9'],['#FCCB90','#E48BC7'],
  ['#4FACFE','#5EEAD4'],['#F6D365','#FDA085'],['#C1DFC4','#4CA1AF'],
  ['#E0C3FC','#8EC5FC'],['#FFE5B4','#F49AB5'],['#A8EADB','#5B9FE3'],
];
function Photo({seed,style}){
  const p=PALETTES[seed%PALETTES.length];
  const v=seed%3;
  const sunX=26+(seed*37)%52, sunY=26+(seed*17)%20, sr=8+(seed%5);
  const hills = v===0
    ? <path d="M0 78 L24 58 L44 74 L62 52 L84 76 L102 62 L120 80 V120 H0 Z" fill="rgba(0,0,0,.14)"/>
    : v===1
    ? <path d="M0 82 L30 56 L58 80 L86 54 L120 82 V120 H0 Z" fill="rgba(0,0,0,.14)"/>
    : <path d="M0 72 C24 60 40 84 66 66 C88 52 104 74 120 68 V120 H0 Z" fill="rgba(0,0,0,.14)"/>;
  return (
    <svg viewBox="0 0 120 120" preserveAspectRatio="xMidYMid slice" style={{display:'block',width:'100%',height:'100%',...style}}>
      <defs>
        <linearGradient id={`pg${seed}`} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={p[0]}/><stop offset="100%" stopColor={p[1]}/>
        </linearGradient>
      </defs>
      <rect width="120" height="120" fill={`url(#pg${seed})`}/>
      <circle cx={sunX} cy={sunY} r={sr} fill="#FFF" opacity="0.85"/>
      {hills}
      <path d="M0 94 L34 78 L64 92 L92 76 L120 88 V120 H0 Z" fill="rgba(0,0,0,.22)"/>
    </svg>
  );
}

function FilesPage({docs,showToast,actions}){
  const [view,setView]=useState('list');
  const [sel,setSel]=useState(new Set());
  const [folder,setFolder]=useState(null);
  const [preview,setPreview]=useState(null);
  const folderObj=folder?docs.find(d=>d.id===folder):null;
  const rows=docs.filter(d=>(d.parent||null)===folder&&!d.deleted).map(d=>{
    if(d.type!=='folder')return d;
    return {...d,items:docs.filter(c=>c.parent===d.id&&!c.deleted).length};
  });
  const toggle=id=>setSel(p=>{const s=new Set(p);if(s.has(id))s.delete(id);else s.add(id);return s;});
  const clearSel=()=>setSel(new Set());
  const doDelete=ids=>{
    actions.delete(ids);clearSel();
    showToast(`已将 ${ids.length} 项移入回收站`);
  };
  const openItem=f=>{
    if(f.type==='folder'){setFolder(f.id);clearSel();}
    else setPreview(f);
  };
  const goRoot=()=>{setFolder(null);clearSel();};
  return (
    <div key={view+'-'+(folder||'root')} className="fade-in" style={{maxWidth:1160,margin:'0 auto',padding:'20px 28px 90px'}}>
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:18,minHeight:44}}>
        {sel.size>0 ? (
          <div className="slide-up" style={{flex:1,display:'flex',alignItems:'center',gap:6,
            background:'var(--accent-lt)',border:'1px solid var(--accent-lt2)',borderRadius:10,height:44,padding:'0 8px 0 16px'}}>
            <I name="check" size={15} color="var(--accent)" sw={2.4}/>
            <span style={{fontSize:13,fontWeight:600,color:'var(--accent)',marginRight:8}}>已选 {sel.size} 项</span>
            <GhostBtn icon="download" onClick={()=>showToast(`已开始下载 ${sel.size} 项`)}>下载</GhostBtn>
            <GhostBtn icon="link" onClick={()=>showToast('分享链接已创建')}>分享</GhostBtn>
            <GhostBtn icon="star" onClick={()=>{[...sel].forEach(actions.star);showToast('已添加收藏')}}>收藏</GhostBtn>
            <GhostBtn icon="trash" danger onClick={()=>doDelete([...sel])}>删除</GhostBtn>
            <div style={{flex:1}}/>
            <GhostBtn icon="close" onClick={clearSel}>取消</GhostBtn>
          </div>
        ) : (
          <React.Fragment>
            <div style={{flex:1}}>
              <div style={{display:'flex',alignItems:'center',gap:7,fontSize:19,fontWeight:700,letterSpacing:'-0.01em'}}>
                {folderObj ? (
                  <React.Fragment>
                    <button onClick={goRoot} style={{color:'var(--text3)',transition:'color .12s'}}
                      onMouseEnter={e=>e.currentTarget.style.color='var(--accent)'}
                      onMouseLeave={e=>e.currentTarget.style.color='var(--text3)'}>我的文件</button>
                    <I name="chevronR" size={16} color="var(--text3)"/>
                    <span>{folderObj.name}</span>
                  </React.Fragment>
                ) : <span>我的文件</span>}
              </div>
              <div style={{fontSize:12.5,color:'var(--text3)',marginTop:1}}>
                {folderObj?`共 ${rows.length} 个项目  ·  点击文件在线预览`:`共 ${rows.length} 项 · 已用 46.5 GB`}
              </div>
            </div>
            <GhostBtn icon="sort">按修改时间</GhostBtn>
            <ViewToggle view={view} onChange={setView}/>
            <PrimaryBtn icon="upload" onClick={()=>showToast('已加入上传队列')}>上传</PrimaryBtn>
          </React.Fragment>
        )}
      </div>
      {rows.length===0 ? (
        <div style={{padding:'90px 0',textAlign:'center'}}>
          <div style={{width:76,height:76,borderRadius:'50%',background:'#fff',border:'1px solid var(--border)',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto'}}>
            <I name="folderPlus" size={28} color="var(--text3)"/>
          </div>
          <div style={{marginTop:16,fontSize:14.5,fontWeight:600}}>此文件夹为空</div>
          <div style={{marginTop:5,fontSize:12.5,color:'var(--text3)'}}>点击右上角「上传」添加文件，或拖拽文件到此处</div>
        </div>
      ) : (view==='list'
        ? <FileTable rows={rows} sel={sel} onToggle={toggle}
            onSelAll={all=>setSel(all?new Set():new Set(rows.map(r=>r.id)))}
            onStar={actions.star} onDelete={doDelete} onOpen={openItem}/>
        : <FileGrid rows={rows} sel={sel} onToggle={toggle} onStar={actions.star} onOpen={openItem}/>)}
      {preview && (
        <PreviewModal file={preview} docs={docs} onClose={()=>setPreview(null)}
          onStar={actions.star}
          onDelete={id=>{actions.delete([id]);setPreview(null);showToast('已移入回收站');}}
          showToast={showToast}/>
      )}
    </div>
  );
}

/* ================= Prototype shell ================= */
const WEB_PAGES=[['files','我的文件'],['recent','最近'],['starred','收藏'],['shared','共享协作'],['trash','回收站'],['photos','相册'],['transfers','传输管理']];
const MOBILE_PAGES=[['files','文件'],['photos','相册'],['transfers','传输'],['shared','共享'],['mine','我的']];
function parseHash(){
  const h=location.hash.replace(/^#\/?/,'');
  const parts=h.split('/');
  if(parts[0]==='web'&&WEB_PAGES.some(p=>p[0]===parts[1]))return{platform:'web',page:parts[1]};
  if(parts[0]==='mobile'&&MOBILE_PAGES.some(p=>p[0]===parts[1]))return{platform:'mobile',page:parts[1]};
  return null;
}
function ProtoNav({route,nav}){
  const isWeb=route.platform==='web';
  const pages=isWeb?WEB_PAGES:MOBILE_PAGES;
  return (
    <div style={{position:'sticky',top:0,zIndex:100,background:'rgba(255,255,255,.9)',
      backdropFilter:'blur(14px)',borderBottom:'1px solid var(--border)'}}>
      <div style={{maxWidth:1480,margin:'0 auto',padding:'0 24px'}}>
        <div style={{height:54,display:'flex',alignItems:'center',gap:12}}>
          <Logo size={28}/>
          <div>
            <div style={{fontSize:14.5,fontWeight:700,lineHeight:1.2}}>Nimbus 云盘</div>
            <div style={{fontSize:10.5,color:'var(--text3)',letterSpacing:'.02em'}}>产品界面原型 v1.0</div>
          </div>
          <div style={{marginLeft:18,display:'flex',background:'#EFF0F2',borderRadius:10,padding:3,gap:2}}>
            {[['web','网页端','monitor'],['mobile','移动 App','phoneDev']].map(p=>(
              <button key={p[0]} onClick={()=>nav(p[0],pages[0][0])} style={{
                display:'flex',alignItems:'center',gap:7,height:32,padding:'0 14px',borderRadius:7.5,
                fontSize:13,fontWeight:route.platform===p[0]?600:500,
                color:route.platform===p[0]?'var(--text1)':'var(--text3)',
                background:route.platform===p[0]?'#fff':'transparent',
                boxShadow:route.platform===p[0]?'0 1px 4px rgba(18,22,33,.12)':'none',
                transition:'all .15s'}}>
                <I name={p[2]} size={15}/>{p[1]}
              </button>
            ))}
          </div>
          <div style={{flex:1}}/>
          <div style={{display:'flex',alignItems:'center',gap:6,fontSize:11.5,color:'var(--text3)'}}>
            <I name="info" size={13}/> 点击页面元素可交互 · 支持多选、删除、恢复等操作
          </div>
        </div>
        <div style={{display:'flex',gap:6,padding:'2px 0 10px',overflowX:'auto'}}>
          {pages.map(p=>(
            <button key={p[0]} onClick={()=>nav(route.platform,p[0])} style={{
              height:30,padding:'0 13px',borderRadius:999,fontSize:12.5,whiteSpace:'nowrap',
              fontWeight:route.page===p[0]?600:500,
              color:route.page===p[0]?'#fff':'var(--text2)',
              background:route.page===p[0]?'#23272E':'transparent',
              transition:'all .15s'}}
              onMouseEnter={e=>{if(route.page!==p[0])e.currentTarget.style.background='#ECEDEF'}}
              onMouseLeave={e=>{if(route.page!==p[0])e.currentTarget.style.background='transparent'}}>
              {p[1]}
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}
function Toast({msg}){
  return (
    <div className="pop-in" style={{position:'absolute',bottom:26,left:'50%',transform:'translateX(-50%)',
      background:'#23272E',color:'#fff',fontSize:13,fontWeight:500,padding:'10px 18px',borderRadius:10,
      boxShadow:'0 8px 30px rgba(18,22,33,.35)',zIndex:200,display:'flex',alignItems:'center',gap:8,
      pointerEvents:'none',whiteSpace:'nowrap'}}>
      <I name="check" size={14} color="#7BC89A" sw={2.2}/>{msg}
    </div>
  );
}
function App(){
  const [route,setRoute]=useState(()=>parseHash()||{platform:'web',page:'files'});
  useEffect(()=>{
    const onHash=()=>{const r=parseHash();if(r)setRoute(r);};
    window.addEventListener('hashchange',onHash);
    return ()=>window.removeEventListener('hashchange',onHash);
  },[]);
  const nav=(platform,page)=>{location.hash=`#/${platform}/${page}`;};
  const [docs,setDocs]=useState(INITIAL_DOCS);
  const [toast,setToast]=useState(null);
  const tRef=useRef(null);
  const showToast=msg=>{
    setToast(msg);
    clearTimeout(tRef.current);
    tRef.current=setTimeout(()=>setToast(null),2200);
  };
  const trash=TRASH_SEED.concat(docs.filter(d=>d.deleted).map(d=>({
    id:d.id,name:d.name,type:d.type,orig:'我的文件',
    deleted:'刚刚',days:d.days||30,
  })));
  const actions={
    star:id=>setDocs(p=>p.map(d=>d.id===id?{...d,star:!d.star}:d)),
    delete:ids=>setDocs(p=>p.map(d=>ids.includes(d.id)?{...d,deleted:true}:d)),
    restore:id=>setDocs(p=>p.map(d=>d.id===id?{...d,deleted:false}:d)),
    purge:id=>setDocs(p=>p.filter(d=>d.id!==id)),
  };
  const isWeb=route.platform==='web';
  return (
    <div style={{minHeight:'100vh',display:'flex',flexDirection:'column'}}>
      <ProtoNav route={route} nav={nav}/>
      {isWeb ? (
        <div style={{flex:1,padding:'18px 24px 26px',minHeight:0}}>
          <div style={{maxWidth:1480,margin:'0 auto',height:'calc(100vh - 168px)',minHeight:640,
            border:'1px solid var(--border)',borderRadius:16,overflow:'hidden',
            boxShadow:'0 20px 60px rgba(18,22,33,.09)',background:'#fff',display:'flex',position:'relative'}}>
            <WebApp page={route.page} onNav={nav} docs={docs} trash={trash} actions={actions} showToast={showToast}/>
            {toast && <Toast msg={toast}/>}
          </div>
        </div>
      ) : (
        <div className="dots-bg" style={{flex:1,padding:'36px 24px 60px'}}>
          <div style={{display:'flex',justifyContent:'center'}}>
            <PhoneFrame>
              <MobileApp page={route.page} onNav={nav} showToast={showToast}/>
            </PhoneFrame>
          </div>
          <div style={{textAlign:'center',marginTop:26,fontSize:12,color:'var(--text3)'}}>
            iPhone 15 Pro · 393 × 852 · 底部 Tab 可切换页面
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

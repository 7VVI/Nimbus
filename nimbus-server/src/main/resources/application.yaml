server:
  port: 8080

spring:
  application:
    name: nimbus-server
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/nimbus_cloud?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: root
    password: root
    druid:
      initial-size: 2
      min-idle: 2
      max-active: 10
      max-wait: 10000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: true
  # 启动时执行建表/种子脚本(幂等: IF NOT EXISTS / INSERT IGNORE)
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/schema.sql
      data-locations: classpath:sql/data.sql
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      timeout: 10s
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB

# Sa-Token 认证配置
sa-token:
  token-name: Authorization
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-read-cookie: false
  is-log: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 框架组件开关(均可装卸)
nimbus:
  json:
    enabled: true
  security:
    enabled: true
    # 在默认白名单基础上追加免登录路径
    ignore-urls:
      - /api/auth/login
      - /api/auth/register
      # 分享访问/浏览/下载免登录, 转存/管理仍需登录
      - /api/share/access
      - /api/share/*/items
      - /api/share/*/download/**
  doc:
    enabled: true
    title: nimbus-cloud API
    description: nimbus-cloud 企业级网盘服务端接口文档
  log:
    enabled: true
  storage:
    # 开箱即用: local 本地磁盘; 切换 oss 对接 MinIO/阿里云 OSS 等 S3 兼容存储
    type: local
    local:
      base-path: ./data/nimbus-storage
    # oss:
    #   endpoint: 127.0.0.1:9000
    #   bucket-name: nimbus
    #   access-key: minioadmin
    #   secret-key: minioadmin
    #   region: us-east-1
    #   https: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.nimbus: debug